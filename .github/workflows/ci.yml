# CI: typecheck + tests, and a rehearsal of the deploy's database step.
# Tests are fully mocked (no database needed) — see src/**/__tests__.
# One exception: warTick.faultInjection.test.ts uses a real Postgres
# connection, but only when RUN_DB_TESTS=1 is set — unset here, so it
# no-ops in this job exactly like every other test file. Run it locally
# against the dev DB when touching game/integrity/ or warTick.ts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  # Rehearse the schema half of the deploy.
  #
  # This job exists because of a real outage: a `@@unique` added to Quest
  # made `prisma db push` — the first command in vercel.json's buildCommand
  # at the time — exit 1, so two deploys in a row died before ever reaching
  # `next build`. Nothing above caught it. Typecheck, tests and `next build`
  # were all green the whole time, because the deploy is the only thing
  # that touches a database.
  #
  # The deploy has since moved to `prisma migrate deploy` (see
  # docs/MIGRATIONS.md — production was baselined with a single
  # `0_baseline` migration once `_prisma_migrations` had no history of its
  # own). `migrate deploy` doesn't diff-and-confirm the way `db push` did;
  # it just applies whatever's in prisma/migrations/ in order, so the
  # matching rehearsal here is simpler: does the full migration history —
  # baseline included — still apply cleanly, in order, to a database that
  # starts with nothing applied? That's exactly production's shape
  # immediately after the baseline resolve, and exactly what every deploy
  # from here on repeats (apply whatever's new since the last one).
  schema-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image: schema.prisma declares Unsupported("vector(1536)")
        # for campaign memory, so plain postgres can't apply it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schemacheck
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schemacheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # The real assertion, exactly as the deploy runs it: if a migration
      # would fail to apply — a SQL error, an ordering problem, anything —
      # it fails here, on the PR, instead of at 2am against production.
      - name: Apply the full migration history, as the deploy would
        run: npx prisma migrate deploy
