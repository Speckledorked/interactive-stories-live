# CI: typecheck + tests, a rehearsal of the deploy's database step, and
# the real-Postgres fault-injection suite.
# The `check` job's tests are fully mocked (no database needed) — see
# src/**/__tests__. A handful of *.liveDb.test.ts / *.faultInjection.test.ts
# files use a real Postgres connection instead, but only when RUN_DB_TESTS=1
# is set — unset in `check`, so they no-op there exactly like every other
# test file would with no database. The `db-tests` job below is what
# actually runs them: an adversarial audit (2026-08-13) found this repo's
# own CI never ran them at all by default, so the deepest correctness
# proof for the systems they cover (see each file's own header) was opt-in
# and, in practice, easy to never run. Run any of them locally against the
# dev DB too when touching what they cover.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Every column a reader depends on has a writer — symbol-level, per
      # (model, column), via the TypeScript checker against the generated
      # Prisma delegate/input/payload types. Also verifies the generated-once
      # column flow manifest (src/lib/game/generatedColumnFlow.ts) from the
      # same program build. Runs here rather than in its own job because it
      # needs exactly what this job already has: npm ci + prisma generate.
      # See scripts/columnFlowAnalysis.ts for the incidents and the design.
      - name: Column wiring
        run: npx tsx scripts/check-column-wiring.ts

      - name: Tests
        run: npx vitest run

  # `npm run lint` was declared in package.json for the life of this project
  # with eslint never installed and no CI job invoking it, so it had never run
  # once. See .eslintrc.js for what the first real run found and why two rules
  # are configured the way they are.
  #
  # Errors fail the job. Warnings are RATCHETED at the count that existed when
  # linting was adopted (--max-warnings 30 in the npm script) — 30 mostly
  # react-hooks/exhaustive-deps findings that are not safe to "fix" mechanically,
  # since changing a dependency array can introduce a render loop. The ratchet
  # freezes that debt instead of pretending it is clean: one new warning fails
  # the job. When it does, fix the warning rather than raising the number.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # The PR-body closing-keyword gate (#453) lives in its own workflow,
  # .github/workflows/pr-closing-keywords.yml, because it needs the `edited`
  # pull_request type — a body is editable up to the merge, so a gate that
  # reads the body has to re-run when it changes. `types:` cannot be scoped
  # to a single job, and putting `edited` here would re-run this whole suite
  # and the real-Postgres job on every description typo. See that file's
  # header.

  # A merged migration file must never be edited again.
  #
  # 20260816090000_world_turn_integrity was applied to production, and three
  # later PRs then appended statements to that same file. `prisma migrate
  # deploy` keys on the migration NAME and does not fail on a checksum
  # mismatch, so those statements ran in CI — which builds its database from
  # the current files — and never ran in production. Every campaign page
  # returned P2022 for a day and a half with CI green throughout.
  #
  # The #455 drift check cannot see this: the files are self-consistent and a
  # fresh database built from them is correct. What had drifted was production,
  # against a history rewritten underneath it. This needs no database — only
  # git — and with the allowlist emptied it rediscovers both edited migrations
  # on its own.
  #
  # fetch-depth: 0 is load-bearing. At the default depth 1 every file looks
  # like it has exactly one commit and the check would pass vacuously forever,
  # so the script refuses to run on a shallow clone rather than reporting green.
  migrations-immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check no applied migration has been edited
        run: npx tsx scripts/check-migrations-immutable.ts

  # Enforces docs/ARCHITECTURE.md's Scorecard Audit Log rule: a Scorecard
  # row's score can't go up without a matching Audit Log entry recording
  # a clean adversarial pass. See that section's own header for why — a
  # real user caught this doc self-grading its own work up with no
  # outside check, repeatedly, and this is the mechanical version of the
  # fix, not just a norm stated in prose and trusted to hold.
  scorecard-audit-trail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needs at least the previous commit to diff scores against
          # (HEAD^1) — a --no-ff merge commit's first parent is exactly
          # main's tip before this push, which is the right baseline.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Scorecard score increases have an audit trail
        run: npx tsx scripts/check-scorecard-audit-trail.ts

  # Rehearse the schema half of the deploy.
  #
  # This job exists because of a real outage: a `@@unique` added to Quest
  # made `prisma db push` — the first command in vercel.json's buildCommand
  # at the time — exit 1, so two deploys in a row died before ever reaching
  # `next build`. Nothing above caught it. Typecheck, tests and `next build`
  # were all green the whole time, because the deploy is the only thing
  # that touches a database.
  #
  # The deploy has since moved to `prisma migrate deploy` (see
  # docs/MIGRATIONS.md — production was baselined with a single
  # `0_baseline` migration once `_prisma_migrations` had no history of its
  # own). `migrate deploy` doesn't diff-and-confirm the way `db push` did;
  # it just applies whatever's in prisma/migrations/ in order, so the
  # matching rehearsal here is simpler: does the full migration history —
  # baseline included — still apply cleanly, in order, to a database that
  # starts with nothing applied? That's exactly production's shape
  # immediately after the baseline resolve, and exactly what every deploy
  # from here on repeats (apply whatever's new since the last one).
  schema-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image: schema.prisma declares Unsupported("vector(1536)")
        # for campaign memory, so plain postgres can't apply it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schemacheck
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schemacheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # The real assertion, exactly as the deploy runs it: if a migration
      # would fail to apply — a SQL error, an ordering problem, anything —
      # it fails here, on the PR, instead of at 2am against production.
      - name: Apply the full migration history, as the deploy would
        run: npx prisma migrate deploy

      # Do the migrations actually ADD UP TO schema.prisma?
      #
      # Nothing asked that before this step, and every other check is blind to
      # it by construction. Edit schema.prisma, forget the migration, and:
      # `prisma generate` builds the client FROM schema.prisma so `tsc` sees
      # the field and passes; the `check` job is fully mocked so it never
      # touches a real column; the step above only replays the migration files
      # that exist, so it passes too. The first thing to notice is a live query
      # against a column that was never created.
      #
      # Two records of the same fact — the schema and the migration history —
      # with nothing comparing them. Same shape as #425's dual columns and
      # #453's docs-vs-tracker.
      #
      # Compares against the database the step above just migrated, not a
      # shadow database: that database IS the migrations' result, and a shadow
      # reset would drop the pgvector extension these migrations require but do
      # not create.
      #
      # On its FIRST run this found two real defects — a column present in
      # every database but missing from the model, and a unique index whose
      # 64-character name Postgres had silently truncated. See
      # scripts/schemaDrift.ts for why the residual is a recorded snapshot
      # rather than "the diff must be empty".
      - name: Check the migrations produce exactly schema.prisma
        run: npx tsx scripts/check-schema-drift.ts

  # Runs the *.liveDb.test.ts / *.faultInjection.test.ts files the `check`
  # job's RUN_DB_TESTS-less `npx vitest run` always skips (see that job's
  # header comment). Any file gated the same way picks this job up
  # automatically, nothing here needs updating per-file. Same pgvector
  # service + migration setup as schema-deploy, since these tests write
  # real rows through the real schema, not a mock.
  #
  # #401: this job is why the adversarial audit's "every test that touches
  # a real Postgres is skipped in the default run" is a statement about the
  # LOCAL default, not about coverage — but it is worth stating plainly,
  # because a local `npx vitest run` reporting 4,000 green while the entire
  # integration surface sits skipped is exactly the kind of signal that
  # reads as more assurance than it is.
  #
  # The most important file here is idleCampaign.liveDb: thirty world turns
  # with no player input, asserting the world actually changed. Both audit
  # passes concluded that single test would have caught their deepest
  # findings, and it would have — because every one of those is a
  # COMPOSITION defect, invisible to a unit test by construction.
  db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbtests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dbtests
      RUN_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Real-database tests
        run: npx vitest run
